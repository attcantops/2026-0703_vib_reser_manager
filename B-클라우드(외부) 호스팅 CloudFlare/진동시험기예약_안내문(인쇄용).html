  .steps b { color: #4f46e5; }
  .foot { margin-top: auto; font-size: 11pt; color: #9ca3af; padding-top: 10mm; }
  @media screen { body { background: #e5e7eb; padding: 20px 0; } .sheet { box-shadow: 0 4px 20px rgba(0,0,0,.15); background:#fff; } .print-btn { position: fixed; top: 16px; right: 16px; background: #4f46e5; color:#fff; border:0; padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight:700; cursor:pointer; } }
